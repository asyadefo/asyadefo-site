<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASYA DEFO</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <style>

        /* ================================
           RESET
        ================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #F5F5F5;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }


        /* ================================
           MAIN
        ================================= */

        .coming-soon {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100svh;
        }


        /* ================================
           LOGO
        ================================= */

        .logo {
            position: absolute;

            left: 4.25vw;
            top: 57.7vh;

            width: 17.5vw;
            height: auto;

            display: block;
        }


        /* ================================
           TEXT
        ================================= */

        .info {
            position: absolute;

            left: 49.6vw;
            top: 57.7vh;

            color: #2147C7;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 27px;
            line-height: 1.35;
            font-weight: 400;
            letter-spacing: -0.4px;

            white-space: nowrap;
        }

        .info div {
            margin: 0;
            padding: 0;
        }


        /* ================================
           TABLET
        ================================= */

        @media (min-width: 701px) and (max-width: 1100px) {

            .logo {
                left: 5vw;
                top: 58vh;
                width: 23vw;
            }

            .info {
                left: 50vw;
                top: 58vh;
                font-size: 23px;
            }
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 700px) {

            .coming-soon {
                width: 100%;
                height: 100svh;
            }

            .logo {
                left: 7vw;
                top: 56vh;

                width: 39vw;
                max-width: 190px;
            }

            .info {
                left: auto;
                right: 7vw;
                top: 56vh;

                font-size: clamp(14px, 4.1vw, 18px);
                line-height: 1.35;
                letter-spacing: -0.2px;
            }
        }


        /* ================================
           VERY SMALL PHONES
        ================================= */

        @media (max-width: 380px) {

            .logo {
                left: 6vw;
                top: 56vh;
                width: 40vw;
            }

            .info {
                right: 6vw;
                top: 56vh;
                font-size: 14px;
            }
        }


        /* ================================
           LANDSCAPE MOBILE
        ================================= */

        @media (max-width: 700px) and (orientation: landscape) {

            .logo {
                left: 7vw;
                top: 55vh;

                width: 28vw;
                max-width: 170px;
            }

            .info {
                right: 7vw;
                top: 55vh;

                font-size: 15px;
            }
        }

    </style>
</head>


<body>

    <main class="coming-soon">

        <img
            class="logo"
            src="logo.png"
            alt="ASYA DEFO"
        >

        <div class="info">
            <div>will be soon</div>
            <div>2026</div>
        </div>

    </main>

</body>
</html>
