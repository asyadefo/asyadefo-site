<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASYA DEFO</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #F5F5F5;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        .coming-soon {
            position: relative;
            width: 100vw;
            height: 100vh;
            min-height: 600px;
        }

        /* ASYA DEFO */

        .logo {
            position: absolute;

            left: 4.25vw;
            bottom: 20.4vh;

            width: 17.5vw;
            height: auto;

            display: block;
        }

        /* WILL BE SOON + 2026 */

        .info {
            position: absolute;

            left: 49.6vw;
            top: 57.7vh;

            color: #2147C7;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 27px;
            line-height: 1.35;
            font-weight: 400;
            letter-spacing: -0.4px;
        }

        .info div {
            margin: 0;
            padding: 0;
        }


        /* --------------------------------
           MOBILE
        -------------------------------- */

        @media (max-width: 700px) {

            .coming-soon {
                min-height: 100svh;
                height: 100svh;
            }

            .logo {
                left: 7vw;
                bottom: 22vh;
                width: 38vw;
            }

            .info {
                left: 52vw;
                top: auto;
                bottom: 23vh;

                font-size: 16px;
                line-height: 1.35;
                letter-spacing: -0.2px;
            }
        }
    </style>
</head>

<body>

    <main class="coming-soon">

        <!-- ТВОЙ ЛОГОТИП -->
        <img
            class="logo"
            src="logo.png"
            alt="ASYA DEFO"
        >

        <!-- ТЕКСТ -->
        <div class="info">
            <div>will be soon</div>
            <div>2026</div>
        </div>

    </main>

</body>
</html>
