<!-- Шапка. active="works" подчёркивает пункт «работы» -->

<main class="case">
  <!-- ==================================================================
       ЭТО ШАБЛОН СТРАНИЦЫ ПРОЕКТА. Чтобы сделать новый проект:
       1) скопируй папку concept целиком и назови, например, sens (получится адрес asyadefo.ru/sens/)
       2) поменяй: <title>, название (h1), подпись под ним (p.case__sub)
       3) в галерее поменяй пути к картинкам (и добавь/удали строки)
       4) в карточке проекта на главной (index.html) укажи ссылку на новую папку: href="sens/"

       ГАЛЕРЕЯ — это просто список картинок и видео, они идут сверху вниз встык.
       Ширина у всех одинаковая (на всю ширину страницы), высота — любая.
       Скругление (10px) у верха первой и у низа последней картинки появляется само,
       даже если ты добавишь или удалишь картинки.

         Картинка:  <img src="../img/concept/01.jpg" alt="что на картинке">
         Видео:     <video src="../img/concept/05.mp4" autoplay muted loop playsinline></video>

       Порядок на странице = порядок строк. Добавить картинку — скопируй строку и
       поменяй номер файла. Видео играют сами, без звука, по кругу.
       Пока файла нет, на его месте серая заглушка.
       ================================================================== -->

  <a class="back" href="../#works"><svg viewBox="0 0 34 10" width="34" height="10" aria-hidden="true"><path d="M33.5 5H1M5.5.5L1 5l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1"/></svg> Все работы</a>

  <h1 class="case__title">Concept</h1>
  <p class="case__sub">Онлайн-платформа для обучения</p>

  <div class="case-gallery">
    <img src="../img/concept/0.1.png" alt="">
    <img src="../img/concept/1.png" alt="">
    <img src="../img/concept/2.png" alt="">
    <img src="../img/concept/3.png" alt="">

    <img src="../img/concept/9.png" alt="">
    <img src="../img/concept/10.png" alt="">
    <img src="../img/concept/11.png" alt="">
    <video src="../img/concept/1.mp4" autoplay muted loop playsinline></video>
  </div>

  <!-- Кнопка «Связаться»: ведёт на главную, к блоку «Есть идея? Обсудим.» -->
  <a class="case-btn" href="../#contact">Связаться</a>

  <!-- Ссылка наружу (например, на проект в Дипрофайле). Замени адрес. Не нужна — удали весь блок -->
  <a class="case-link" href="https://dprofile.ru/case/176955/concept-website" target="_blank" rel="noopener">Дипрофайл <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1 13L13 1M4 1h9v9" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></a>
